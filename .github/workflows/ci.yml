name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CHATGPT2API_AUTH_KEY: ci-test-key-0123456789

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: python-3.13

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        continue-on-error: true
        run: uv run mypy .

      - name: Test + coverage (pytest)
        run: |
          mkdir -p reports/coverage
          uv run pytest --cov=services --cov=api \
            --cov-report=json:reports/coverage/coverage.json \
            --cov-report=term-missing \
            -m "not live and not redis"

      - name: Coverage gate
        # fail_under 阈值读 pyproject.toml [tool.coverage.report]（当前 55，实测基线 60%）
        run: uv run coverage report --show-missing

      - name: OpenAPI spec --check
        run: uv run python scripts/generate_openapi_spec.py --check

      - name: SDK --check
        run: uv run python scripts/generate_sdks.py --check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: reports/coverage/
          if-no-files-found: warn

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: python-3.13

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen

      - name: Contract guard
        run: uv run python scripts/contract_guard.py

      - name: SQL audit
        run: uv run python scripts/sql_audit.py

      - name: Mutation probe
        run: uv run python scripts/mutation_probe.py

      - name: Docs sync check
        run: uv run python scripts/docs_sync_check.py
