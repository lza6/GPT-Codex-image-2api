name: PR Check

on:
  pull_request:
    branches: [main]

env:
  CHATGPT2API_AUTH_KEY: ci-test-key-0123456789

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: python-3.13

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        continue-on-error: true
        run: uv run mypy .

      - name: Test (pytest)
        run: uv run pytest -m "not live and not redis"

      - name: Contract guard check
        run: uv run python scripts/contract_guard.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload web_dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web_dist
          path: web/web_dist
          if-no-files-found: warn
