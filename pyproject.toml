[project]
name = "chatgpt2api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.15.0",
    "fastapi>=0.136.0",
    "pillow>=12.2.0",
    "pybase64>=1.4.3",
    "python-multipart>=0.0.26",
    "tiktoken>=0.12.0",
    "uvicorn>=0.44.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "gitpython>=3.1.0",
    "prometheus-client>=0.26.0",
    "redis>=5.0.0",
    "cachetools>=7.1.7",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "hypothesis>=6.60.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
# 默认排除需真实上游/活服务的测试，保证 CI 稳定不触网
addopts = "-m 'not live and not redis'"
markers = [
    "live: 需要真实上游 OpenAI 或活服务(localhost:23456)的测试，CI 默认排除，本地手动 pytest -m live 运行",
    "redis: 需要 Redis 的测试，CI 默认排除",
    "unit: 纯单元测试（不触网、不需活服务）",
    "property: 属性基测试（hypothesis），可能随机生成大量输入",
]
# 测试文件收集路径（live 测试仍放 test/ 下，用标记区分而非目录隔离）
testpaths = ["test"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# 宽松起步：E(风格)/F(未用导入等)/I(import排序)/UP(语法升级)，逐步收紧
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",  # 行宽由 formatter 处理
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
# 现状宽松：仅扫语法与明显类型错误，逐步收紧
warn_unused_ignores = false
warn_redundant_casts = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

# ── 覆盖率门禁（VII-01，增量门）────────────────────────────────────
# 实测基线：services+api 行覆盖率 60~62%（2026-08-12 两轮全量实测，排除 live/redis）。
# 目标 90%+；当前门禁 fail_under=55 留环境波动裕量，每提升一档上调 5pt，
# 基线记录见 docs/verification-registry.md。
# 本地 `uv run pytest`（不带 --cov）不受影响；CI 与 scripts/coverage_guard.py 显式 --cov。
[tool.coverage.run]
source = ["services", "api"]
branch = false
omit = ["*/test/*", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 55
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
